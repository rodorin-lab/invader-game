<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🦋 グラムちゃん・サイバー・インベーダー 👾</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a0033 0%, #0d0021 50%, #1a0033 100%);
  color: #e0d4ff;
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(2px 2px at 20px 30px, #d4a5ff, transparent),
    radial-gradient(2px 2px at 40px 70px, #a88cff, transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(2px 2px at 130px 80px, #d4a5ff, transparent);
  background-repeat: repeat;
  background-size: 200px 200px;
  opacity: 0.3;
  pointer-events: none;
  z-index: 0;
}
.header {
  z-index: 1; text-align: center; padding: 10px 20px; width: 100%;
  display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap;
}
h1 {
  font-size: clamp(1.2em, 4vw, 2.5em);
  background: linear-gradient(90deg, #d4a5ff, #ff6b9d, #d4a5ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-shadow: 0 0 30px rgba(212,165,255,0.5);
}
.lang-btn {
  background: rgba(168,140,255,0.2); border: 1px solid rgba(168,140,255,0.5);
  color: #d4a5ff; padding: 5px 12px; border-radius: 15px; cursor: pointer;
  font-size: 0.85em; transition: all 0.2s;
}
.lang-btn:hover, .lang-btn.active { background: rgba(168,140,255,0.5); box-shadow: 0 0 15px rgba(168,140,255,0.5); }
.game-container { z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; }
canvas {
  border: 3px solid #a88cff; border-radius: 10px;
  box-shadow: 0 0 20px rgba(168,140,255,0.4), 0 0 40px rgba(168,140,255,0.2), inset 0 0 20px rgba(168,140,255,0.1);
  background: linear-gradient(135deg, #0d001a 0%, #1a0033 100%);
  max-width: 95vw; max-height: 70vh;
  touch-action: none;
}
.ui-panel {
  display: flex; justify-content: space-around; width: 100%;
  padding: 8px 10px; background: rgba(168,140,255,0.1);
  border: 1px solid rgba(168,140,255,0.3); border-radius: 8px; gap: 5px;
  flex-wrap: wrap;
}
.ui-item { text-align: center; min-width: 60px; }
.ui-label { font-size: 0.65em; color: #a88cff; text-transform: uppercase; letter-spacing: 1px; }
.ui-value { font-size: clamp(1em, 3vw, 1.5em); font-weight: bold; color: #d4a5ff; }
.powerup-bar {
  display: flex; gap: 8px; align-items: center; padding: 5px 10px;
  background: rgba(168,140,255,0.08); border-radius: 15px;
}
.powerup-icon {
  width: 32px; height: 32px; border: 2px solid rgba(168,140,255,0.3);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1em; opacity: 0.3; transition: all 0.3s;
}
.powerup-icon.active { opacity: 1; border-color: #d4a5ff;
  box-shadow: 0 0 15px rgba(212,165,255,0.5); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
.footer { font-size: 0.7em; color: rgba(168,140,255,0.6); z-index: 1; text-align: center; padding: 5px; }
.touch-controls {
  display: none; gap: 10px; justify-content: center; width: 100%; max-width: 400px; z-index: 1; margin-top: 5px;
}
.touch-btn {
  width: 55px; height: 55px; background: rgba(168,140,255,0.2);
  border: 2px solid rgba(168,140,255,0.5); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3em; color: #d4a5ff; user-select: none; -webkit-user-select: none;
  touch-action: none; cursor: pointer;
}
.touch-btn:active { background: rgba(168,140,255,0.5); box-shadow: 0 0 20px rgba(168,140,255,0.5); }
.touch-fire { width: 65px; height: 65px; background: rgba(255,107,157,0.3); border-color: #ff6b9d; }
@media (max-width:600px) {
  .touch-controls { display: flex; }
  .ui-panel { padding: 5px; }
}
</style>
</head>
<body>

<div class="header">
  <h1 id="gameTitle">🦋 グラムちゃん・サイバー・インベーダー 👾</h1>
  <div>
    <button class="lang-btn active" id="btnJa" onclick="setLang('ja')">🇯🇵 JP</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
</div>

<div class="game-container">
  <canvas id="mycanvas" width="400" height="600"></canvas>
  
  <div class="ui-panel">
    <div class="ui-item"><div class="ui-label" data-i18n="score">SCORE</div><div class="ui-value" id="scoreDisplay">0</div></div>
    <div class="ui-item"><div class="ui-label" data-i18n="high">HIGH</div><div class="ui-value" id="highDisplay">0</div></div>
    <div class="ui-item"><div class="ui-label" data-i18n="wave">WAVE</div><div class="ui-value" id="waveDisplay">1</div></div>
    <div class="ui-item"><div class="ui-label" data-i18n="combo">COMBO</div><div class="ui-value" id="comboDisplay">x0</div></div>
    <div class="ui-item"><div class="ui-label" data-i18n="lives">LIVES</div><div class="ui-value" id="livesDisplay">❤️❤️❤️</div></div>
  </div>

  <div class="powerup-bar" id="powerupBar">
    <div class="powerup-icon" id="spreadIcon">💫</div>
    <div class="powerup-icon" id="shieldIcon">🛡️</div>
    <div class="powerup-icon" id="rapidIcon">⚡</div>
    <div class="powerup-icon" id="megaIcon">💥</div>
  </div>

  <div class="touch-controls" id="touchControls">
    <div class="touch-btn" id="tLeft">⬅️</div>
    <div class="touch-btn touch-fire" id="tFire">🔥</div>
    <div class="touch-btn" id="tRight">➡️</div>
  </div>
</div>

<div class="footer">💜 <span data-i18n="for">For</span> ロドリンお兄ちゃん 💜</div>

<script>
// ============================================================
// 🦋 グラムちゃん・サイバー・インベーダー - FULL GAME
// ============================================================

// --- i18n ---
const I18N = {
  ja: {
    score: 'SCORE', high: 'HIGH', wave: 'WAVE', combo: 'COMBO', lives: 'LIVES',
    for: 'For',
    start: '▶ タップしてスタート ◀',
    gameover: 'GAME OVER',
    restart: 'スペース/タップでリスタート',
    waveTitle: 'WAVE',
    bossWarning: '⚠️ BOSS APPROACHING ⚠️',
    paused: 'ポーズ中',
    shoot: '撃て!',
  },
  en: {
    score: 'SCORE', high: 'HIGH', wave: 'WAVE', combo: 'COMBO', lives: 'LIVES',
    for: 'For',
    start: '▶ TAP TO START ◀',
    gameover: 'GAME OVER',
    restart: 'Press SPACE/TAP to Restart',
    waveTitle: 'WAVE',
    bossWarning: '⚠️ BOSS APPROACHING ⚠️',
    paused: 'PAUSED',
    shoot: 'FIRE!',
  }
};
let lang = 'ja';
function t(key) { return I18N[lang][key] || key; }
function setLang(l) {
  lang = l;
  document.getElementById('btnJa').classList.toggle('active', l==='ja');
  document.getElementById('btnEn').classList.toggle('active', l==='en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });
}

// --- Canvas ---
const canvas = document.getElementById('mycanvas');
const ctx = canvas.getContext('2d');
let W = 400, H = 600;
canvas.width = W; canvas.height = H;

// --- Game State ---
const STATE = {
  menu: 0, playing: 1, gameover: 2, paused: 3, bossIntro: 4
};
let state = STATE.menu;
let score = 0, highScore = parseInt(localStorage.getItem('invaderHighScore')) || 0;
let wave = 1, combo = 0, lives = 3;
let frame = 0, animTick = 0;
let gameTime = 0;

// --- Player ---
const player = {
  x: W/2, y: H - 60, w: 32, h: 24,
  speed: 4, dx: 0,
  shootCooldown: 0, maxShootCD: 12,
  invincible: 0,
};
let playerBullets = [];

// --- Power-ups ---
const powerups = {
  spread: { active: false, timer: 0, maxTime: 480 },
  shield: { active: false, timer: 0, maxTime: 600 },
  rapid: { active: false, timer: 0, maxTime: 480 },
  mega: { active: false, timer: 0, maxTime: 360 },
};
let powerupItems = [];

// --- Enemies ---
let enemies = [];
let enemyBullets = [];
let enemyDir = 1, enemySpeed = 0.5, enemyDrop = 10;
let enemyMoveTimer = 0, enemyMaxTimer = 30;

// --- Boss ---
let boss = null;

// --- Particles ---
let particles = [];
let screenShake = 0;
let stars = [];
for(let i=0; i<50; i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+1, sp:Math.random()*0.5+0.1});

// --- Controls ---
let keys = {};
let mouseX = W/2;

// ============================================================
// ENEMY TYPES
// ============================================================
const ENEMY_TYPES = {
  squid: {
    color: '#ff6b9d', points: 10,
    w: 24, h: 16,
    frames: [
      ['..xx..','xxxxxx','x..x.x','xxxxxx'],
      ['..xx..','xxxxxx','x....x','xxxxxx'],
    ]
  },
  crab: {
    color: '#d4a5ff', points: 20,
    w: 28, h: 20,
    frames: [
      ['...x...','xx.xxx','.x..x.','xx.xxx'],
      ['..x...','xx.xxx','.x..x.','xx.xxx'],
    ]
  },
  octopus: {
    color: '#00e5ff', points: 30,
    w: 32, h: 20,
    frames: [
      ['..xxx..','x.xxx.x','xxxxxxxx','x..x..x.'],
      ['..xxx..','x.xxx.x','x..x..x','xxxxxxxx'],
    ]
  },
};

// ============================================================
// DRAWING HELPERS
// ============================================================
function drawPixelSprite(px, py, pattern, color, size) {
  const sz = size || 2;
  ctx.fillStyle = color;
  for(let r=0; r<pattern.length; r++) {
    for(let c=0; c<pattern[r].length; c++) {
      if(pattern[r][c] === 'x') {
        ctx.fillRect(px + c*sz, py + r*sz, sz, sz);
      }
    }
  }
}

function drawGlowCircle(x, y, r, color, glow) {
  ctx.shadowColor = color;
  ctx.shadowBlur = glow || 15;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function spawnParticles(x, y, color, count, spread) {
  for(let i=0; i<count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * (spread||5) + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 30 + Math.random()*20,
      maxLife: 50,
      color: color,
      size: Math.random()*3+2,
    });
  }
}

// ============================================================
// GAME LOGIC
// ============================================================
function resetGame() {
  score = 0; wave = 1; combo = 0; lives = 3;
  player.x = W/2; player.y = H-60;
  player.invincible = 60;
  player.dx = 0;
  playerBullets = [];
  enemyBullets = [];
  powerupItems = [];
  powerups.spread.active = false;
  powerups.shield.active = false;
  powerups.rapid.active = false;
  powerups.mega.active = false;
  boss = null;
  spawnWave();
  updateUI();
}

function spawnWave() {
  enemies = [];
  const rows = Math.min(3 + Math.floor(wave/3), 7);
  const cols = Math.min(5 + Math.floor(wave/2), 10);
  const types = [ENEMY_TYPES.squid, ENEMY_TYPES.crab, ENEMY_TYPES.octopus];
  
  const startX = (W - cols * 40) / 2;
  const startY = 50;
  
  for(let r=0; r<rows; r++) {
    const type = types[Math.floor(r / 2) % 3];
    for(let c=0; c<cols; c++) {
      enemies.push({
        x: startX + c*40,
        y: startY + r*35,
        w: type.w, h: type.h,
        type: type,
        alive: true,
        frame: 0,
        animTimer: 0,
      });
    }
  }
  enemyDir = 1;
  enemySpeed = 0.5 + wave * 0.05;
  enemyMaxTimer = Math.max(15, 30 - wave);
  enemyMoveTimer = 0;
}

function spawnBoss() {
  boss = {
    x: W/2, y: -60,
    w: 64, h: 48,
    hp: 20 + wave * 5,
    maxHp: 20 + wave * 5,
    speed: 1.5,
    dir: 1,
    phase: 0, // 0=enter, 1=attack
    attackTimer: 0,
    maxAttackTimer: 60,
    pattern: [
      '.x.x.x.x.',
      'x.xxxxx.x',
      'xxxxxxxxx',
      '.x.x.x.x.',
      'xxx.xxx',
      'x.xxx.x',
      'x.xxx.x',
    ],
    color: '#ff1744',
  };
}

function gameOver() {
  state = STATE.gameover;
  if(score > highScore) {
    highScore = score;
    localStorage.setItem('invaderHighScore', highScore);
  }
  updateUI();
}

function fireBullet() {
  if(player.shootCooldown > 0) return;
  
  const cd = powerups.rapid.active ? 4 : powerups.rapid.maxTime ? 8 : player.maxShootCD;
  player.shootCooldown = cd;
  
  const bx = player.x;
  const by = player.y - player.h/2 - 5;
  
  if(powerups.spread.active) {
    playerBullets.push({x: bx, y: by, vx: -1.5, vy: -6, w: 3, h: 8, color: '#ff6b9d', trail: []});
    playerBullets.push({x: bx, y: by, vx: 0, vy: -7, w: 3, h: 8, color: '#d4a5ff', trail: []});
    playerBullets.push({x: bx, y: by, vx: 1.5, vy: -6, w: 3, h: 8, color: '#ff6b9d', trail: []});
  } else {
    playerBullets.push({x: bx, y: by, vx: 0, vy: -7, w: 3, h: 8, color: '#d4a5ff', trail: []});
  }
  
  if(powerups.mega.active) {
    playerBullets[playerBullets.length-1].w = 8;
    playerBullets[playerBullets.length-1].h = 16;
    playerBullets[playerBullets.length-1].vy = -10;
    playerBullets[playerBullets.length-1].color = '#ff6b9d';
  }
}

function updateBullets() {
  // Player bullets
  for(let i=playerBullets.length-1; i>=0; i--) {
    const b = playerBullets[i];
    b.trail.push({x: b.x, y: b.y});
    if(b.trail.length > 5) b.trail.shift();
    b.x += b.vx;
    b.y += b.vy;
    
    // Hit enemies
    let hit = false;
    for(let e of enemies) {
      if(!e.alive) continue;
      if(Math.abs(b.x - e.x) < e.w/2 + b.w && Math.abs(b.y - e.y) < e.h/2 + b.h) {
        e.alive = false;
        hit = true;
        combo++;
        score += e.type.points * (1 + Math.floor(combo/5)*0.5);
        spawnParticles(e.x, e.y, e.type.color, 15, 6);
        screenShake = 5;
        checkPowerupDrop(e.x, e.y);
        break;
      }
    }
    
    if(!hit && boss) {
      if(Math.abs(b.x - boss.x) < boss.w/2 + b.w && Math.abs(b.y - boss.y) < boss.h/2 + b.h) {
        hit = true;
        const dmg = powerups.mega.active ? 3 : powerups.rapid.active ? 2 : 1;
        boss.hp -= dmg;
        score += 50;
        spawnParticles(b.x, b.y, boss.color, 10, 4);
        screenShake = 3;
      }
    }
    
    if(hit || b.y < -20 || b.x < -20 || b.x > W+20) {
      playerBullets.splice(i, 1);
    }
  }
  
  // Enemy bullets
  for(let i=enemyBullets.length-1; i>=0; i--) {
    const b = enemyBullets[i];
    b.y += b.vy || 3;
    
    // Hit player
    if(Math.abs(b.x - player.x) < 12 && Math.abs(b.y - player.y) < 15) {
      hitPlayer();
      enemyBullets.splice(i, 1);
      continue;
    }
    
    if(b.y > H+10) {
      enemyBullets.splice(i, 1);
    }
  }
}

function hitPlayer() {
  if(powerups.shield.active) {
    powerups.shield.active = false;
    powerups.shield.timer = 0;
    updatePowerupUI();
    spawnParticles(player.x, player.y, '#76ff03', 20, 8);
    screenShake = 10;
    return;
  }
  if(player.invincible > 0) return;
  
  lives--;
  player.invincible = 90;
  screenShake = 15;
  spawnParticles(player.x, player.y, '#ff6b9d', 20, 8);
  updateUI();
  
  if(lives <= 0) gameOver();
}

function enemyShoot() {
  const alive = enemies.filter(e => e.alive);
  if(alive.length === 0) return;
  
  // Pick random bottom enemy per column
  const cols = {};
  for(let e of alive) {
    const col = Math.round(e.x / 40);
    if(!cols[col] || e.y > cols[col].y) cols[col] = e;
  }
  const candidates = Object.values(cols);
  if(candidates.length === 0) return;
  
  const shooter = candidates[Math.floor(Math.random() * candidates.length)];
  if(Math.random() < 0.02 * (1 + wave*0.05)) {
    enemyBullets.push({x: shooter.x, y: shooter.y + shooter.h/2, vy: 2 + wave*0.1});
  }
}

function checkPowerupDrop(x, y) {
  if(Math.random() < 0.12) {
    const types = ['spread', 'shield', 'rapid', 'mega'];
    const type = types[Math.floor(Math.random()*types.length)];
    powerupItems.push({x, y, type, vy: 1.5, life: 300});
  }
}

function updatePowerups() {
  // Active powerups
  for(let key in powerups) {
    if(powerups[key].active) {
      powerups[key].timer--;
      if(powerups[key].timer <= 0) {
        powerups[key].active = false;
      }
    }
  }
  updatePowerupUI();
  
  // Falling items
  for(let i=powerupItems.length-1; i>=0; i--) {
    const item = powerupItems[i];
    item.y += item.vy;
    item.life--;
    
    // Collect
    if(Math.abs(item.x - player.x) < 20 && Math.abs(item.y - player.y) < 25) {
      powerups[item.type].active = true;
      powerups[item.type].timer = powerups[item.type].maxTime;
      spawnParticles(item.x, item.y, '#ffd700', 20, 8);
      screenShake = 3;
      updatePowerupUI();
      powerupItems.splice(i, 1);
      continue;
    }
    
    if(item.y > H+20 || item.life <= 0) {
      powerupItems.splice(i, 1);
    }
  }
}

function updatePowerupUI() {
  document.getElementById('spreadIcon').classList.toggle('active', powerups.spread.active);
  document.getElementById('shieldIcon').classList.toggle('active', powerups.shield.active);
  document.getElementById('rapidIcon').classList.toggle('active', powerups.rapid.active);
  document.getElementById('megaIcon').classList.toggle('active', powerups.mega.active);
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = Math.floor(score);
  document.getElementById('highDisplay').textContent = highScore;
  document.getElementById('waveDisplay').textContent = wave;
  document.getElementById('comboDisplay').textContent = 'x' + combo;
  document.getElementById('livesDisplay').textContent = '❤️'.repeat(Math.max(0,lives));
}

function moveEnemies() {
  enemyMoveTimer++;
  if(enemyMoveTimer < enemyMaxTimer) return;
  enemyMoveTimer = 0;
  
  let edgeHit = false;
  for(let e of enemies) {
    if(!e.alive) continue;
    e.x += enemySpeed * enemyDir;
    if(e.x < 20 || e.x > W-20) edgeHit = true;
    e.frame = (e.frame + 1) % e.type.frames.length;
  }
  
  if(edgeHit) {
    enemyDir *= -1;
    for(let e of enemies) {
      if(e.alive) e.y += enemyDrop;
    }
    enemySpeed += 0.02;
  }
  
  // Check if enemies reached player
  for(let e of enemies) {
    if(e.alive && e.y > player.y - 30) {
      gameOver();
      return;
    }
  }
}

function updateBoss() {
  if(!boss) return;
  
  if(boss.phase === 0) {
    boss.y += 1;
    if(boss.y >= 80) {
      boss.phase = 1;
    }
  }
  
  if(boss.phase === 1) {
    boss.x += boss.speed * boss.dir;
    if(boss.x < 40 || boss.x > W-40) boss.dir *= -1;
    
    boss.attackTimer++;
    if(boss.attackTimer >= boss.maxAttackTimer) {
      boss.attackTimer = 0;
      // Boss shoots pattern
      for(let i=-2; i<=2; i++) {
        enemyBullets.push({x: boss.x + i*15, y: boss.y + boss.h/2, vy: 2 + Math.abs(i)*0.5, vx: i*0.5});
      }
      screenShake = 5;
    }
  }
}

// ============================================================
// DRAWING
// ============================================================
function draw() {
  ctx.save();
  
  // Screen shake
  if(screenShake > 0) {
    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    screenShake *= 0.9;
    if(screenShake < 0.5) screenShake = 0;
  }
  
  // Background
  ctx.fillStyle = '#0d001a';
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  for(let s of stars) {
    s.y += s.sp;
    if(s.y > H) { s.y = 0; s.x = Math.random()*W; }
    ctx.fillStyle = `rgba(255,255,255,${0.3+s.y/H*0.7})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  
  // Grid
  ctx.strokeStyle = 'rgba(168,140,255,0.04)';
  ctx.lineWidth = 1;
  for(let i=0; i<W; i+=40) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke();
  }
  for(let i=0; i<H; i+=40) {
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke();
  }
  
  // Particles
  for(let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life--;
    if(p.life <= 0) { particles.splice(i,1); continue; }
    const alpha = p.life/p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Powerup items
  for(let item of powerupItems) {
    const colors = {spread:'#ff6b9d', shield:'#76ff03', rapid:'#00e5ff', mega:'#ffd700'};
    const icons = {spread:'💫', shield:'🛡️', rapid:'⚡', mega:'💥'};
    const col = colors[item.type] || '#fff';
    const pulse = Math.sin(gameTime/200) * 3;
    ctx.shadowColor = col;
    ctx.shadowBlur = 15;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(item.x, item.y, 10 + pulse, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = '13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icons[item.type], item.x, item.y);
  }
  
  // Enemies
  for(let e of enemies) {
    if(!e.alive) continue;
    const pattern = e.type.frames[e.frame];
    ctx.shadowColor = e.type.color;
    ctx.shadowBlur = 8;
    drawPixelSprite(
      e.x - e.w/2,
      e.y - e.h/2,
      pattern, e.type.color, 2
    );
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x-5, e.y-3, 3, 3);
    ctx.fillRect(e.x+2, e.y-3, 3, 3);
    ctx.shadowBlur = 0;
  }
  
  // Boss
  if(boss) {
    const pulse = Math.sin(gameTime/100) * 3;
    ctx.shadowColor = boss.color;
    ctx.shadowBlur = 30 + pulse;
    ctx.fillStyle = boss.color;
    drawPixelSprite(boss.x - boss.w/2, boss.y - boss.h/2, boss.pattern, boss.color, 3);
    ctx.shadowBlur = 0;
    
    // Boss HP bar
    const barW = 120, barH = 8;
    const barX = W/2 - barW/2;
    const barY = 5;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.roundRect(barX-1, barY-1, barW+2, barH+2, 3);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.roundRect(barX, barY, barW, barH, 2);
    ctx.fill();
    const hpRatio = Math.max(0, boss.hp/boss.maxHp);
    const hpColor = hpRatio > 0.5 ? '#76ff03' : hpRatio > 0.25 ? '#ffd700' : '#ff1744';
    ctx.fillStyle = hpColor;
    ctx.shadowColor = hpColor;
    ctx.shadowBlur = 10;
    ctx.roundRect(barX+1, barY+1, (barW-2)*hpRatio, barH-2, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Boss eyes
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    const eyeOff = Math.sin(gameTime/200) * 2;
    ctx.beginPath();
    ctx.arc(boss.x-12, boss.y-eyeOff, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(boss.x+12, boss.y-eyeOff, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // Player (Gram-chan ship)
  ctx.shadowColor = player.invincible > 0 && Math.floor(gameTime/50)%2===0 ? '#d4a5ff' : 'transparent';
  ctx.shadowBlur = player.invincible > 0 ? 20 : 0;
  
  // Draw player ship as cute shape
  const px = player.x, py = player.y;
  ctx.fillStyle = '#d4a5ff';
  // Body
  ctx.beginPath();
  ctx.moveTo(px, py-15);
  ctx.lineTo(px+18, py+10);
  ctx.lineTo(px+12, py+15);
  ctx.lineTo(px-12, py+15);
  ctx.lineTo(px-18, py+10);
  ctx.closePath();
  ctx.fill();
  
  // Cockpit
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.moveTo(px, py-8);
  ctx.lineTo(px+8, py+5);
  ctx.lineTo(px-8, py+5);
  ctx.closePath();
  ctx.fill();
  
  // Wings
  ctx.fillStyle = '#a88cff';
  ctx.fillRect(px-20, py+3, 6, 12);
  ctx.fillRect(px+14, py+3, 6, 12);
  
  // Eyes on cockpit
  ctx.fillStyle = '#fff';
  ctx.fillRect(px-4, py-2, 3, 3);
  ctx.fillRect(px+1, py-2, 3, 3);
  ctx.shadowBlur = 0;
  
  // Player bullet trails
  for(let b of playerBullets) {
    for(let t of b.trail) {
      ctx.fillStyle = b.color + '40';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
    ctx.shadowBlur = 0;
  }
  
  // Enemy bullets
  for(let b of enemyBullets) {
    ctx.shadowColor = '#ff6b9d';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff6b9d';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  ctx.restore();
  
  // --- UI OVERLAY ---
  if(state === STATE.menu) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#d4a5ff';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#d4a5ff';
    ctx.shadowBlur = 20;
    ctx.fillText('🦋 グラムちゃん 👾', W/2, H/2-60);
    ctx.shadowBlur = 0;
    
    ctx.font = '18px "Courier New", monospace';
    ctx.fillStyle = '#a88cff';
    ctx.fillText(t('start'), W/2, H/2+10);
    
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('←→ Move | Space Fire | Touch to Play', W/2, H/2+45);
  }
  
  if(state === STATE.gameover) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ff6b9d';
    ctx.font = 'bold 36px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff6b9d';
    ctx.shadowBlur = 20;
    ctx.fillText(t('gameover'), W/2, H/2-40);
    ctx.shadowBlur = 0;
    
    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = '#d4a5ff';
    ctx.fillText(`${t('score')}: ${Math.floor(score)}`, W/2, H/2+10);
    
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#a88cff';
    ctx.fillText(t('restart'), W/2, H/2+45);
  }
  
  if(state === STATE.bossIntro) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff1744';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 30;
    ctx.fillText(t('bossWarning'), W/2, H/2);
    ctx.shadowBlur = 0;
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function update() {
  if(state === STATE.menu) return;
  if(state === STATE.gameover) return;
  
  gameTime++;
  frame++;
  
  if(state === STATE.bossIntro) {
    if(frame % 120 === 0) {
      state = STATE.playing;
      spawnBoss();
    }
    return;
  }
  
  // Player movement
  if(keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
  else if(keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;
  else player.dx *= 0.8;
  
  player.x += player.dx;
  if(player.x < 20) player.x = 20;
  if(player.x > W-20) player.x = W-20;
  
  if(player.invincible > 0) player.invincible--;
  
  // Shooting
  if(player.shootCooldown > 0) player.shootCooldown--;
  if(keys['Space']) fireBullet();
  
  // Enemies
  moveEnemies();
  if(frame % Math.max(5, 20 - wave) === 0) enemyShoot();
  
  // Boss
  if(boss) updateBoss();
  
  // Bullets
  updateBullets();
  
  // Powerups
  updatePowerups();
  
  // Check wave clear
  const alive = enemies.filter(e => e.alive);
  if(alive.length === 0 && !boss) {
    wave++;
    if(wave % 3 === 0) {
      state = STATE.bossIntro;
    } else {
      spawnWave();
    }
    updateUI();
  }
  
  // Boss defeated
  if(boss && boss.hp <= 0) {
    spawnParticles(boss.x, boss.y, '#ff1744', 40, 10);
    screenShake = 20;
    score += 1000;
    boss = null;
    wave++;
    updateUI();
    spawnWave();
  }
  
  updateUI();
}

function drawLoop() {
  draw();
  requestAnimationFrame(drawLoop);
}

function gameLoop() {
  update();
  setTimeout(gameLoop, 1000/60);
}

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space') e.preventDefault();
  if(e.code === 'Space' && state === STATE.gameover) {
    state = STATE.menu;
    resetGame();
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

canvas.addEventListener('click', e => {
  if(state === STATE.menu) {
    state = STATE.playing;
    resetGame();
  } else if(state === STATE.gameover) {
    state = STATE.menu;
    resetGame();
  }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  mouseX = (e.clientX - rect.left) * scaleX;
  if(state === STATE.playing) {
    // Smooth follow
    player.x += (mouseX - player.x) * 0.1;
  }
});

// Touch controls
let touchInterval = null;
document.getElementById('tLeft').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft']=true; });
document.getElementById('tLeft').addEventListener('touchend', e => { e.preventDefault(); keys['ArrowLeft']=false; });
document.getElementById('tRight').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight']=true; });
document.getElementById('tRight').addEventListener('touchend', e => { e.preventDefault(); keys['ArrowRight']=false; });

document.getElementById('tFire').addEventListener('touchstart', e => {
  e.preventDefault();
  keys['Space'] = true;
  if(state === STATE.menu || state === STATE.gameover) {
    canvas.dispatchEvent(new Event('click'));
  }
});
document.getElementById('tFire').addEventListener('touchend', e => { e.preventDefault(); keys['Space']=false; });

// Touch on canvas for mobile
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(state === STATE.menu || state === STATE.gameover) {
    canvas.dispatchEvent(new Event('click'));
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const scaleX = W / rect.width;
  mouseX = (touch.clientX - rect.left) * scaleX;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const scaleX = W / rect.width;
  mouseX = (touch.clientX - rect.left) * scaleX;
  if(state === STATE.playing) {
    player.x += (mouseX - player.x) * 0.1;
  }
});

// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r > w/2) r = w/2;
    if(r > h/2) r = h/2;
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y);
    this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r);
    this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r);
    this.quadraticCurveTo(x, y, x+r, y);
    return this;
  };
}

// ============================================================
// START
// ============================================================
updateUI();
drawLoop();
gameLoop();
</script>
