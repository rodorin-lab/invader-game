<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🦋グラムちゃん👾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:#0a001a;color:#e0d4ff;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(1px 1px at 10% 30%,rgba(212,165,255,0.8),transparent),radial-gradient(1px 1px at 50% 60%,rgba(255,107,157,0.8),transparent),radial-gradient(1px 1px at 80% 20%,rgba(118,255,3,0.6),transparent);background-repeat:repeat;background-size:200px 200px;pointer-events:none;z-index:0;animation:sm 30s linear infinite}
@keyframes sm{0%{background-position:0 0}100%{background-position:200px 200px}}
.header{z-index:2;display:flex;justify-content:center;align-items:center;gap:6px;padding:3px 8px;width:100%;flex-shrink:0}
.header h1{font-size:clamp(0.65em,2.5vw,1em);background:linear-gradient(90deg,#d4a5ff,#ff6b9d,#ffd700,#76ff03,#d4a5ff);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:h1a 4s ease infinite;white-space:nowrap}
@keyframes h1a{0%{background-position:0% center}50%{background-position:100% center}100%{background-position:0% center}}
.lang-btn{background:rgba(168,140,255,0.15);border:1px solid rgba(168,140,255,0.4);color:#d4a5ff;padding:2px 7px;border-radius:10px;cursor:pointer;font-size:clamp(0.5em,1.8vw,0.65em);white-space:nowrap}
.lang-btn.active,.lang-btn:active{background:rgba(168,140,255,0.4);border-color:#d4a5ff;box-shadow:0 0 10px rgba(168,140,255,0.3)}
#app{position:relative;width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;padding:0 4px;gap:2px;overflow:hidden;z-index:1}
#cw{position:relative;flex:1;min-height:0;border-radius:8px;overflow:hidden;border:2px solid rgba(168,140,255,0.5)}
#cw canvas{width:100%!important;height:100%!important;display:block;background:#050010}
#to{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10}
#dz{position:absolute;left:0;top:0;width:100%;height:100%}
#di{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:rgba(212,165,255,0.2);transform:translate(-50%,-50%);transition:transform 0.02s;pointer-events:none;box-shadow:0 0 15px rgba(212,165,255,0.15)}
#dl{position:absolute;right:10px;bottom:6px;font-size:clamp(0.45em,1.5vw,0.55em);color:rgba(168,140,255,0.25);pointer-events:none;letter-spacing:1px}
#hud{display:flex;justify-content:space-around;align-items:center;width:100%;padding:2px 4px;background:rgba(168,140,255,0.05);border:1px solid rgba(168,140,255,0.12);border-radius:8px;flex-shrink:0}
.hi{text-align:center;min-width:0;flex:1}
.hl{font-size:clamp(0.4em,1.4vw,0.5em);color:#a88cff;text-transform:uppercase;letter-spacing:0.5px;opacity:0.7}
.hv{font-size:clamp(0.6em,2vw,0.85em);font-weight:bold}
.hs{color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,0.3)}
.hh{color:#ff6b9d;text-shadow:0 0 6px rgba(255,107,157,0.2)}
.hw{color:#00e5ff;text-shadow:0 0 6px rgba(0,229,255,0.2)}
.hc{color:#76ff03;text-shadow:0 0 6px rgba(118,255,3,0.2)}
.hlv{color:#ff1744;text-shadow:0 0 6px rgba(255,23,68,0.2);letter-spacing:1px}
#br{display:flex;justify-content:center;gap:3px;padding:2px 0;flex-shrink:0}
.bc{width:clamp(34px,8vw,42px);height:clamp(34px,8vw,42px);border-radius:50%;border:2px solid rgba(168,140,255,0.2);background:rgba(168,140,255,0.06);display:flex;align-items:center;justify-content:center;font-size:clamp(0.75em,2.5vw,0.95em);color:#d4a5ff;flex-shrink:0;transition:all 0.08s}
.bc.pressed{transform:scale(0.88);background:rgba(168,140,255,0.2);box-shadow:0 0 10px rgba(168,140,255,0.2)}
.bf{background:rgba(255,107,157,0.1);border-color:#ff6b9d;font-size:clamp(0.85em,2.8vw,1em)}
.bf.pressed{background:rgba(255,107,157,0.3);box-shadow:0 0 15px rgba(255,107,157,0.3)}
.ba{border-color:rgba(255,215,0,0.25);font-size:clamp(0.65em,2.2vw,0.8em);background:rgba(255,215,0,0.05)}
.ba.active{border-color:#ffd700;background:rgba(255,215,0,0.2);box-shadow:0 0 10px rgba(255,215,0,0.3)}
.bb{border-color:rgba(255,23,68,0.25);font-size:clamp(0.7em,2.4vw,0.85em);background:rgba(255,23,68,0.05)}
.bb.pressed{background:rgba(255,23,68,0.25);box-shadow:0 0 12px rgba(255,23,68,0.3)}

#ss{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.6)}
#ss.hide{display:none}
#st{font-size:clamp(1.1em,4.5vw,1.6em);color:#d4a5ff;text-shadow:0 0 20px rgba(212,165,255,0.5);margin-bottom:6px;text-align:center}
#st small{display:block;font-size:0.4em;color:rgba(168,140,255,0.4);margin-top:2px;font-weight:normal}
#sb{padding:clamp(10px,2.5vw,12px) clamp(30px,8vw,45px);background:linear-gradient(135deg,#ff6b9d,#d4a5ff);border:2px solid rgba(255,255,255,0.3);border-radius:25px;color:#fff;font-size:clamp(0.85em,3vw,1.1em);font-weight:bold;box-shadow:0 0 20px rgba(212,165,255,0.3);animation:sbP 1.5s ease infinite}
@keyframes sbP{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#sh{margin-top:6px;font-size:clamp(0.45em,1.5vw,0.55em);color:rgba(168,140,255,0.25)}

#go{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7)}
#go.show{display:flex}
#got{font-size:clamp(1.1em,4.5vw,1.8em);color:#ff1744;text-shadow:0 0 25px rgba(255,23,68,0.6);margin-bottom:6px}
#gosc{font-size:clamp(0.75em,2.8vw,1em);color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.3)}
#gonh{font-size:clamp(0.5em,1.8vw,0.7em);color:#76ff03;text-shadow:0 0 8px rgba(118,255,3,0.3);margin:3px 0}
#gor{font-size:clamp(0.55em,2vw,0.75em);color:#d4a5ff;margin-top:4px;animation:gorP 1.5s ease infinite}
@keyframes gorP{0%,100%{opacity:0.5}50%{opacity:1}}
</style>
</head>
<body>
<div class="header">
  <h1>🦋グラムちゃん・サイバー・インベーダー👾</h1>
  <div><button class="lang-btn active" id="bj">🇯🇵JP</button><button class="lang-btn" id="be">🇬🇧EN</button></div>
</div>
<div id="app">
  <div id="cw">
    <canvas id="c"></canvas>
    <div id="to">
      <div id="dz"><div id="di"></div><div id="dl">← ドラッグで移動 →</div></div>
    </div>
    <div id="ss">
      <div id="st">🦋グラムちゃん<small>CYBER INVADER</small></div>
      <button id="sb">▶ タップしてスタート ◀</button>
      <div id="sh">画面どこでもドラッグで移動 | オート連射</div>
    </div>
    <div id="go">
      <div id="got">GAME OVER</div><div id="gosc">SCORE: 0</div><div id="gonh"></div><div id="gor">▶ タップしてリスタート ◀</div>
    </div>
  </div>
  <div id="hud">
    <div class="hi"><div class="hl">SCORE</div><div class="hv hs" id="scr">0</div></div>
    <div class="hi"><div class="hl">HIGH</div><div class="hv hh" id="high">0</div></div>
    <div class="hi"><div class="hl">WAVE</div><div class="hv hw" id="wav">1</div></div>
    <div class="hi"><div class="hl">COMBO</div><div class="hv hc" id="cmb">x0</div></div>
    <div class="hi"><div class="hl">LIVES</div><div class="hv hlv" id="liv">❤️❤️❤️</div></div>
  </div>
  <div id="br">
    <div class="bc" id="bl">⬅️</div>
    <div class="bc ba" id="ba">🔄</div>
    <div class="bc bf" id="bf">🔥</div>
    <div class="bc bb" id="bb">💣</div>
    <div class="bc" id="brr">➡️</div>
  </div>
</div>
<script>
(function(){
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function sz(){const p=C.parentElement;W=p.clientWidth;H=p.clientHeight;C.width=W;C.height=H}
sz();addEventListener('resize',sz);

// lang
const TX={ja:{s:'▶ タップしてスタート ◀',g:'GAME OVER',r:'▶ タップしてリスタート ◀',nh:'★ NEW HIGH SCORE! ★',hint:'画面どこでもドラッグで移動 | オート連射'},
  en:{s:'▶ TAP TO START ◀',g:'GAME OVER',r:'▶ TAP TO RESTART ◀',nh:'★ NEW HIGH SCORE! ★',hint:'Drag anywhere to move | Auto-fire ON'}};
let L='ja';
function setL(l){L=l;document.getElementById('bj').className='lang-btn'+(l==='ja'?' active':'');document.getElementById('be').className='lang-btn'+(l==='en'?' active':'');
  document.getElementById('sb').textContent=TX[l].s;document.getElementById('sh').textContent=TX[l].hint;document.getElementById('gor').textContent=TX[l].r}
document.getElementById('bj').addEventListener('click',()=>setL('ja'));
document.getElementById('be').addEventListener('click',()=>setL('en'));

// audio
let A=null;
function iA(){if(!A)A=new(window.AudioContext||window.webkitAudioContext)()}
function t(f,d,ty){if(!A)return;const o=A.createOscillator(),g=A.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(0.2,A.currentTime);g.gain.exponentialRampToValueAtTime(0.001,A.currentTime+(d||0.1));o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+(d||0.1))}
function sS(){t(880,0.05);setTimeout(()=>t(660,0.03),20)}
function sH(){t(200,0.08,'sawtooth')}
function sE(){for(let i=0;i<5;i++)setTimeout(()=>t(100+Math.random()*200,0.1,'sawtooth'),i*30)}
function sP(){t(523,0.1);setTimeout(()=>t(659,0.1),80);setTimeout(()=>t(784,0.15),160)}
function sG2(){t(400,0.2);setTimeout(()=>t(300,0.2),200);setTimeout(()=>t(200,0.4),400)}
function sW(){t(523,0.1);setTimeout(()=>t(659,0.1),100);setTimeout(()=>t(784,0.1),200);setTimeout(()=>t(1047,0.3),300)}
let BM=false,BT=null;
function bS(){if(!A||BM)return;BM=true;const b=[110,110,147,147,165,165,147,147,110,110,131,131,147,147,131,131],m=[440,440,523,523,587,587,659,659,784,659,587,523,440,523,587,440];let be=0;BT=setInterval(()=>{if(!BM){clearInterval(BT);return}t(b[be%16],0.12,'triangle');if(be%4===0)t(m[be%16],0.1);be++},150)}
function bP(){BM=false;if(BT){clearInterval(BT);BT=null}}

// game state
const ST={M:0,P:1,O:2,BI:3};
let st=ST.M,sc=0,hs=parseInt(localStorage.getItem('iH')||'0'),wv=1,cb=0,lv=3,fr=0,gt=0,sh=0;
let pl={x:W/2||200,y:(H||400)-50,w:28,h:22,sp:4,dx:0,cd:0,cm:10,iv:0};
let pb=[],eb=[],en=[],pt=[],pu=[],bo=null,ed=1,es=0.5,edr=8,et=0,em=25;
let pw={sp:{a:0,t:0,mt:480},sh:{a:0,t:0,mt:600},rp:{a:0,t:0,mt:480},mg:{a:0,t:0,mt:360}};
let K={},bn=3,bd=0;let ss=[];
function iS2(){ss=[];for(let i=0;i<40;i++)ss.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,sp:Math.random()*0.5+0.1})}
iS2();
const ET={sq:{c:'#ff6b9d',p:10,w:22,h:14,fr:[['..xx..','xxxxxx','x..x.x','xxxxxx','xxxxxx','x....x'],['..xx..','xxxxxx','x....x','xxxxxx','xxxxxx','x....x']]},cr:{c:'#d4a5ff',p:20,w:26,h:18,fr:[['...x...','xx.xxx','.x..x.','xx.xxx','xx.xxx','.x..x.'],['..x...','xx.xxx','.x..x.','xx.xxx','xx.xxx','.x..x.']]},oc:{c:'#00e5ff',p:30,w:30,h:18,fr:[['..xxx..','x.xxx.x','xxxxxxxx','x..x..x','x..x..x','xxxxxxxx'],['..xxx..','x.xxx.x','x..x..x','x..x..x','xxxxxxxx','xxxxxxxx']]}};

function dS(px,py,pa,c,sz){X.fillStyle=c;const s=sz||2;for(let r=0;r<pa.length;r++)for(let c=0;c<pa[r].length;c++)if(pa[r][c]==='x')X.fillRect(px+c*s,py+r*s,s,s)}
function sP2(x,y,c,n,sd,sz){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*(sd||4)+1;pt.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:20+Math.random()*20,ml:40,c,sz:Math.random()*(sz||3)+1})}}
function rG(){sc=0;wv=1;cb=0;lv=3;bn=3;bd=0;pl.x=W/2;pl.y=H-50;pl.iv=60;pl.dx=0;pl.cd=0;pb=[];eb=[];en=[];pt=[];pu=[];Object.keys(pw).forEach(k=>{pw[k].a=0;pw[k].t=0});bo=null;document.getElementById('ba').classList.remove('active');sW2();uU();uP2();uB2();bS()}
function sW2(){en=[];const r=Math.min(3+Math.floor(wv/3),7),c=Math.min(5+Math.floor(wv/2),10),ty=[ET.sq,ET.cr,ET.oc],sx=(W-c*36)/2,sy=40;for(let row=0;row<r;row++){const t=ty[Math.floor(row/2)%3];for(let col=0;col<c;col++)en.push({x:sx+col*36,y:sy+row*32,w:t.w,h:t.h,ty:t,al:1,fr:0})}ed=1;es=0.5+wv*0.05;em=Math.max(15,25-wv);et=0}
function sB2(){bo={x:W/2,y:-60,w:64,h:48,hp:20+wv*5,hm:20+wv*5,sp:1.5,dr:1,ph:0,at:0,pa:['.x.x.x.x.','x.xxxxx.x','xxxxxxxxx','x.xxxxx.x','.x.x.x.x.','xxx.xxx','x.xxx.x','x.xxx.x'],c:'#ff1744'}}
function fB2(){if(pl.cd>0)return;pl.cd=pw.rp.a?4:pl.cm;sS();if(pw.sp.a){pb.push({x:pl.x,y:pl.y-pl.h/2-3,vx:-1.5,vy:-6,w:3,h:8,c:'#ff6b9d',tr:[]});pb.push({x:pl.x,y:pl.y-pl.h/2-3,vx:0,vy:-7,w:3,h:8,c:'#d4a5ff',tr:[]});pb.push({x:pl.x,y:pl.y-pl.h/2-3,vx:1.5,vy:-6,w:3,h:8,c:'#ff6b9d',tr:[]})}else{const b={x:pl.x,y:pl.y-pl.h/2-3,vx:0,vy:-7,w:3,h:8,c:'#d4a5ff',tr:[]};if(pw.mg.a){b.w=8;b.h=16;b.vy=-10;b.c='#ffd700'}pb.push(b)}}
function uB3(){for(let i=pb.length-1;i>=0;i--){const b=pb[i];b.tr.push({x:b.x,y:b.y});if(b.tr.length>6)b.tr.shift();b.x+=b.vx;b.y+=b.vy;let hit=0;for(let e of en){if(!e.al)continue;if(Math.abs(b.x-e.x)<e.w/2+b.w&&Math.abs(b.y-e.y)<e.h/2+b.h){e.al=0;hit=1;cb++;const pts=e.ty.p*(1+Math.floor(cb/5)*0.5);sc+=pts;sP2(e.x,e.y,e.ty.c,20,6,3);sh=4;sE();pD(e.x,e.y);break}}if(!hit&&bo&&Math.abs(b.x-bo.x)<bo.w/2+b.w&&Math.abs(b.y-bo.y)<bo.h/2+b.h){hit=1;bo.hp-=pw.mg.a?3:(pw.rp.a?2:1);sc+=50;sP2(b.x,b.y,bo.c,12,4,3);sh=3;sH()}if(hit||b.y<-20||b.x<-20||b.x>W+20)pb.splice(i,1)}for(let i=eb.length-1;i>=0;i--){const b=eb[i];b.y+=b.vy||3;if(Math.abs(b.x-pl.x)<14&&Math.abs(b.y-pl.y)<16){hP2();eb.splice(i,1);continue}if(b.y>H+10)eb.splice(i,1)}}
function hP2(){if(pw.sh.a){pw.sh.a=0;pw.sh.t=0;uP2();sP2(pl.x,pl.y,'#76ff03',25,8,4);sh=10;sH();return}if(pl.iv>0)return;lv--;pl.iv=90;sh=15;sP2(pl.x,pl.y,'#ff6b9d',25,8,4);sH();uU();if(lv<=0){sG2();bP();shGO()}}
function shGO(){st=ST.O;document.getElementById('go').classList.add('show');document.getElementById('gosc').textContent='SCORE: '+Math.floor(sc);if(sc>hs){hs=Math.floor(sc);localStorage.setItem('iH',String(hs));document.getElementById('gonh').textContent=TX[L].nh;document.getElementById('gonh').style.display='block'}else document.getElementById('gonh').style.display='none'}
function eS2(){const al=en.filter(e=>e.al);if(!al.length)return;const co={};for(let e of al){const c=Math.round(e.x/36);if(!co[c]||e.y>co[c].y)co[c]=e}const ca=Object.values(co);if(!ca.length)return;const s=ca[Math.floor(Math.random()*ca.length)];if(Math.random()<0.02*(1+wv*0.05))eb.push({x:s.x,y:s.y+s.h/2,vy:2+wv*0.1})}
function pD(x,y){if(Math.random()<0.12)pu.push({x,y,ty:['sp','sh','rp','mg'][Math.floor(Math.random()*4)],vy:1.5,life:300})}
function uP2(){for(let k in pw){if(pw[k].a){pw[k].t--;if(pw[k].t<=0)pw[k].a=0}}for(let i=pu.length-1;i>=0;i--){const p=pu[i];p.y+=p.vy;p.life--;if(Math.abs(p.x-pl.x)<20&&Math.abs(p.y-pl.y)<25){pw[p.ty].a=1;pw[p.ty].t=pw[p.ty].mt;sP2(p.x,p.y,'#ffd700',25,8,4);sh=3;sP();for(let k in pw){const e=document.getElementById('pu_'+k);if(e)e.style.display=pw[k].a?'flex':'none'};pu.splice(i,1);continue}if(p.y>H+20||p.life<=0)pu.splice(i,1)}}
function uU(){document.getElementById('scr').textContent=Math.floor(sc);document.getElementById('high').textContent=hs;document.getElementById('wav').textContent=wv;document.getElementById('cmb').textContent='x'+cb;document.getElementById('liv').textContent='❤️'.repeat(Math.max(0,lv))}
function uB2(){document.getElementById('bb').textContent=bn>0?'💣':'⛔';document.getElementById('bb').style.opacity=bd>0?'0.4':'1'}
function mE2(){et++;if(et<em)return;et=0;let edge=0;for(let e of en){if(!e.al)continue;e.x+=es*ed;if(e.x<15||e.x>W-15)edge=1;e.fr=(e.fr+1)%e.ty.fr.length}if(edge){ed*=-1;for(let e of en)if(e.al)e.y+=edr;es+=0.02}for(let e of en)if(e.al&&e.y>pl.y-30){bP();shGO();return}}
function uBO2(){if(!bo)return;if(bo.ph===0){bo.y+=1;if(bo.y>=70)bo.ph=1}if(bo.ph===1){bo.x+=bo.sp*bo.dr;if(bo.x<35||bo.x>W-35)bo.dr*=-1;bo.at++;if(bo.at>=40){bo.at=0;for(let i=-2;i<=2;i++)eb.push({x:bo.x+i*12,y:bo.y+bo.h/2,vy:2.5+Math.abs(i)*0.3,vx:i*0.3});sh=5;sH()}}}

function drw(){
  X.clearRect(0,0,W,H);X.save();
  if(sh>0){X.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);sh*=0.9;if(sh<0.5)sh=0}
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d001a');g.addColorStop(0.5,'#1a0033');g.addColorStop(1,'#0d001a');X.fillStyle=g;X.fillRect(0,0,W,H);
  for(let s of ss){s.y+=s.sp;if(s.y>H){s.y=0;s.x=Math.random()*W}X.fillStyle=`rgba(255,255,255,${0.2+s.y/H*0.6})`;X.shadowBlur=2;X.shadowColor='rgba(255,255,255,0.2)';X.fillRect(s.x,s.y,s.s,s.s)}X.shadowBlur=0;
  X.strokeStyle='rgba(168,140,255,0.03)';X.lineWidth=1;for(let i=0;i<W;i+=30){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}for(let i=0;i<H;i+=30){X.beginPath();X.moveTo(0,i);X.lineTo(W,i);X.stroke()}
